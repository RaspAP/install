name: Sync raspbian.sh from raspap-webgui

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out install repo
        uses: actions/checkout@v4

      - name: Fetch latest installer
        run: |
          curl -fsSL -o raspbian.sh.new \
            https://raw.githubusercontent.com/RaspAP/raspap-webgui/master/installers/raspbian.sh
          # sanity check: must be a non-empty shell script
          test -s raspbian.sh.new
          head -n1 raspbian.sh.new | grep -q '^#!'
          mv raspbian.sh.new index.html

      - name: Commit if changed
        run: |
          if git diff --quiet -- raspbian.sh; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add raspbian.sh
          git commit -m "Sync install loader from raspap-webgui"
          git push
